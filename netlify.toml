# Netlify hosting for the sureshv1 branch.
# In the Netlify UI: connect this repo and set "Production branch" (or a
# Branch Deploy) to sureshv1 — you'll get a URL like sureshv1--<site>.netlify.app.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Serve at the domain root (overrides the /Imaginarium/ base used by GH Pages).
  VITE_BASE = "/"
  # three-bvh-csg has a peer-dep conflict; allow the install to proceed.
  NPM_FLAGS = "--legacy-peer-deps"

# Single-page app fallback so deep links / refreshes resolve to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (Netlify honours these; GitHub Pages cannot send headers).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://apis.google.com https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' https: wss: ws:; worker-src 'self' blob:; frame-src https://accounts.google.com https://content.googleapis.com; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
