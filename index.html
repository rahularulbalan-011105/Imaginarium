<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Security ──────────────────────────────────────────────────────────
         Content-Security-Policy: restrict where code/data can come from. The app
         is self-contained (no external scripts), but the Arduino simulator uses
         eval and Rapier uses WASM, so script-src needs 'unsafe-eval'/'wasm-
         unsafe-eval'; inline theme/redirect scripts + Tailwind need 'unsafe-
         inline'. object-src 'none' + base-uri 'self' + form-action 'self' block
         the common injection payloads; connect-src allows https/wss/ws + blob:
         + data: (three.js fetches embedded GLB textures via blob:). Real headers
         (HSTS, X-Frame-Options) are set on
         Netlify/Vercel/Cloudflare — GitHub Pages can't send them. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://apis.google.com https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' https: wss: ws: blob: data:; worker-src 'self' blob:; frame-src https://accounts.google.com https://content.googleapis.com; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Clickjacking guard (meta CSP can't set frame-ancestors on GH Pages): if
         we're framed by another site, break out. Cloudflare/Netlify add a real
         X-Frame-Options header on top. -->
    <script>
      if (window.top !== window.self) {
        try { window.top.location = window.self.location; }
        catch (e) { document.documentElement.style.display = 'none'; }
      }
    </script>

    <!-- Landing gate: the live app now sends EVERY visitor (all devices) to the
         landing page (constructa-page.atumx.in), carrying the UTM query along.
         Runs FIRST, before the bundle downloads. Only fires on the production host.
         The DIRECT LINK  https://constructa.atumx.in/?app=1  opts straight into
         the app and is remembered (localStorage), so beta users you hand that
         link to always land in the editor — not the landing page. -->
    <script>
      (function () {
        try {
          var LANDING = 'https://constructa-page.atumx.in';
          var onApp = /(^|\.)constructa\.atumx\.in$/i.test(location.hostname);
          var optOut = /[?&]app=1(?:&|$)/.test(location.search);
          var saved = false;
          try { saved = localStorage.getItem('constructa_direct') === '1'; } catch (e) {}
          if (optOut) { try { localStorage.setItem('constructa_direct', '1'); } catch (e) {} }
          if (onApp && !optOut && !saved) {
            location.replace(LANDING + location.search + location.hash);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./constructa-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Constructa — design 3D robots, wire up electronics, program them with Arduino code or blocks, and battle them with physics, all in your browser." />
    <title>Constructa — Robot Builder &amp; Simulation</title>
    <!-- Theme: restore the saved palette before first paint so there is no flash.
         Default is dark. The full token set lives in src/styles/globals.css. -->
    <script>
      // Set theme + page background before first paint (no flash). The background
      // is applied inline (not via an inline <style>) to avoid a Vite multi-page
      // html-inline-css-proxy build race with the second HTML entry.
      (function () {
        var t = 'dark';
        try {
          var s = localStorage.getItem('app-theme');
          if (s === 'dark' || s === 'light') t = s;
        } catch (e) {}
        document.documentElement.dataset.theme = t;
        document.documentElement.style.background = (t === 'light') ? '#F7F7F7' : '#121212';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
