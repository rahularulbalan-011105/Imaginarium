<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Security ──────────────────────────────────────────────────────────
         Content-Security-Policy: restrict where code/data can come from. The app
         is self-contained (no external scripts), but the Arduino simulator uses
         eval and Rapier uses WASM, so script-src needs 'unsafe-eval'/'wasm-
         unsafe-eval'; inline theme/redirect scripts + Tailwind need 'unsafe-
         inline'. object-src 'none' + base-uri 'self' + form-action 'self' block
         the common injection payloads; connect-src is https/wss-only (blocks
         cleartext exfiltration). Real headers (HSTS, X-Frame-Options) are set on
         Netlify/Vercel/Cloudflare — GitHub Pages can't send them. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://apis.google.com https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' https: wss: ws:; worker-src 'self' blob:; frame-src https://accounts.google.com https://content.googleapis.com; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Clickjacking guard (meta CSP can't set frame-ancestors on GH Pages): if
         we're framed by another site, break out. Cloudflare/Netlify add a real
         X-Frame-Options header on top. -->
    <script>
      if (window.top !== window.self) {
        try { window.top.location = window.self.location; }
        catch (e) { document.documentElement.style.display = 'none'; }
      }
    </script>

    <!-- Device split: the app is desktop-only, so mobile visitors of the live
         app are sent to the landing page (video + Discord + email), carrying the
         UTM query along. Runs FIRST, before the bundle downloads, so mobile users
         don't pull the heavy app. Desktop falls through and loads the editor.
         Only fires on the production host; add ?app=1 to force the app on mobile. -->
    <script>
      (function () {
        try {
          var LANDING = 'https://constructa-page.atumx.in';
          var ua = navigator.userAgent || '';
          var isMobile = /Mobi|Android|iPhone|iPod|Windows Phone|BlackBerry|IEMobile|Opera Mini/i.test(ua)
            || (navigator.userAgentData && navigator.userAgentData.mobile === true);
          var onApp = /(^|\.)constructa\.atumx\.in$/i.test(location.hostname);
          var optOut = /[?&]app=1(?:&|$)/.test(location.search);
          if (isMobile && onApp && !optOut) {
            location.replace(LANDING + location.search + location.hash);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./constructa-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Constructa — design 3D robots, wire up electronics, program them with Arduino code or blocks, and battle them with physics, all in your browser." />
    <title>Constructa — Robot Builder &amp; Simulation</title>
    <!-- Theme: restore the saved palette before first paint so there is no flash.
         Default is dark. The full token set lives in src/styles/globals.css. -->
    <script>
      // Set theme + page background before first paint (no flash). The background
      // is applied inline (not via an inline <style>) to avoid a Vite multi-page
      // html-inline-css-proxy build race with the second HTML entry.
      (function () {
        var t = 'dark';
        try {
          var s = localStorage.getItem('app-theme');
          if (s === 'dark' || s === 'light') t = s;
        } catch (e) {}
        document.documentElement.dataset.theme = t;
        document.documentElement.style.background = (t === 'light') ? '#F7F7F7' : '#121212';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
