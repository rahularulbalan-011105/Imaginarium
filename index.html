<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Device split: the app is desktop-only, so mobile visitors of the live
         app are sent to the landing page (video + Discord + email), carrying the
         UTM query along. Runs FIRST, before the bundle downloads, so mobile users
         don't pull the heavy app. Desktop falls through and loads the editor.
         Only fires on the production host; add ?app=1 to force the app on mobile. -->
    <script>
      (function () {
        try {
          var LANDING = 'https://constructa-page.atumx.in';
          var ua = navigator.userAgent || '';
          var isMobile = /Mobi|Android|iPhone|iPod|Windows Phone|BlackBerry|IEMobile|Opera Mini/i.test(ua)
            || (navigator.userAgentData && navigator.userAgentData.mobile === true);
          var onApp = /(^|\.)constructa\.atumx\.in$/i.test(location.hostname);
          var optOut = /[?&]app=1(?:&|$)/.test(location.search);
          if (isMobile && onApp && !optOut) {
            location.replace(LANDING + location.search + location.hash);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./constructa-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Constructa — design 3D robots, wire up electronics, program them with Arduino code or blocks, and battle them with physics, all in your browser." />
    <title>Constructa — Robot Builder &amp; Simulation</title>
    <!-- Theme: restore the saved palette before first paint so there is no flash.
         Default is dark. The full token set lives in src/styles/globals.css. -->
    <script>
      // Set theme + page background before first paint (no flash). The background
      // is applied inline (not via an inline <style>) to avoid a Vite multi-page
      // html-inline-css-proxy build race with the second HTML entry.
      (function () {
        var t = 'dark';
        try {
          var s = localStorage.getItem('app-theme');
          if (s === 'dark' || s === 'light') t = s;
        } catch (e) {}
        document.documentElement.dataset.theme = t;
        document.documentElement.style.background = (t === 'light') ? '#F7F7F7' : '#121212';
      })();
    </script>
    <script type="module" crossorigin src="./assets/main-D-o5USii.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-09ZhZTkr.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
